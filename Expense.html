
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
<link rel="stylesheet" href="Expense.css">
</head>
<body>

    <!-- Main heading -->
    <h1>Smart Expense Tracker</h1>
    <p>Keep track of your spending.</p>

    <!-- Form for adding a new expense -->
    <h2>Add an Expense</h2>

    <form id="expense-form">

        <!-- Expense name -->
        <label for="expense-name">Expense Name:</label>
        <input
            type="text"
            id="expense-name"
            placeholder="e.g., Lunch"
        >

        <!-- Expense amount -->
        <label for="expense-amount">Amount ($):</label>
        <input
            type="number"
            id="expense-amount"
            placeholder="e.g., 12.50"
            step="0.01"
        >

        <!-- Expense category -->
        <label for="expense-category">Category:</label>
        <select id="expense-category">
            <option value="">Select a category</option>
            <option value="Food">Food</option>
            <option value="Transportation">Transportation</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
        </select>

        <!-- Button to add the expense -->
        <button type="submit">Add Expense</button>

    </form>

    <!-- Area for displaying error messages -->
    <p id="error-message"></p>

    <!-- Section showing all expenses -->
    <h2>My Expenses</h2>
    <ul id="expense-list">
        <!-- JavaScript will display expenses here later -->
    </ul>

    <!-- Section showing the total spent -->
    <h2>Total Spent</h2>
    <p id="total-spent">$0.00</p>
<script src="Expense.js"></script>
</body>
</html>
